name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: docker.io

permissions:
  contents: read

# Cancel superseded pull-request runs, but never interrupt a publish already in flight on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend (JUnit, MockMvc, Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # GitHub-hosted runners ship a running Docker daemon, so the Testcontainers
      # integration tests start real PostgreSQL and RabbitMQ without extra setup.
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  ml-tests:
    name: ML worker (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # requirements-dev.txt starts with "-r requirements.txt", so both files have to be
          # part of the cache key or a change to the runtime deps would reuse a stale cache.
          cache-dependency-path: |
            ml-service/requirements-dev.txt
            ml-service/requirements.txt

      - name: Install dependencies
        run: pip install -r ml-service/requirements-dev.txt

      # Nothing in pytest needs the fixtures yet, but the E2E suite does and is not run in CI,
      # so this is the only thing keeping generate_fixtures.py from rotting unnoticed.
      - name: Generate test fixtures
        run: python3 testdata/generate_fixtures.py --artifact /tmp/ci-fixture.joblib --force

      - name: Run pytest
        run: pytest

  frontend-build:
    name: Frontend (typecheck and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` runs `tsc -b` first, so this also typechecks.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint

  docker:
    name: Build service images
    needs: [backend-tests, ml-tests, frontend-build]
    # Pull requests get the test jobs only; publishing happens on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            image: lipid-classifier-frontend
          - service: backend
            context: ./backend
            image: lipid-classifier-backend
          - service: ml-worker
            context: ./ml-service
            image: lipid-classifier-ml-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

  update-manifests:
    name: Pin image tags in manifests
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pin new image tags in kustomization.yaml
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          for svc in backend frontend ml-worker; do
            name="docker.io/${DOCKERHUB_USERNAME}/lipid-classifier-${svc}"
            yq -i \
              "(.images[] | select(.name == \"${name}\") | .newTag) = \"${IMAGE_TAG}\"" \
              k8s/kustomization.yaml
          done
          echo "Updated image tags:"
          yq '.images' k8s/kustomization.yaml

      - name: Commit and push tag bump
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- k8s/kustomization.yaml; then
            echo "No tag changes to commit."
            exit 0
          fi
          git add k8s/kustomization.yaml
          git commit -m "ci: pin image tags to ${IMAGE_TAG} [skip ci]"
          git push origin HEAD:main
