name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend (JUnit, MockMvc, Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # GitHub-hosted runners ship a running Docker daemon, so the Testcontainers
      # integration tests start real PostgreSQL and RabbitMQ without extra setup.
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  ml-tests:
    name: ML worker (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # requirements-dev.txt starts with "-r requirements.txt", so both files have to be
          # part of the cache key or a change to the runtime deps would reuse a stale cache.
          cache-dependency-path: |
            ml-service/requirements-dev.txt
            ml-service/requirements.txt

      - name: Install dependencies
        run: pip install -r ml-service/requirements-dev.txt

      # Nothing in pytest needs the fixtures yet, but the E2E suite does and is not run in CI,
      # so this is the only thing keeping generate_fixtures.py from rotting unnoticed. 
      - name: Generate test fixtures
        run: python3 testdata/generate_fixtures.py --artifact /tmp/ci-fixture.joblib --force

      - name: Run pytest
        run: pytest

  frontend-build:
    name: Frontend (typecheck and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` runs `tsc -b` first, so this also typechecks the data-testid changes.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint
